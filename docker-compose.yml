services:
  postgres:
    image: postgres:16-alpine
    container_name: olist_checkout_postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-olist_checkout}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - olist_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olist_checkout_laravel
    working_dir: /var/www/html
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    ports:
      - "${LARAVEL_PORT:-8000}:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-olist_checkout}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_TTL=${JWT_TTL:-60}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-20160}
      - JWT_ALGO=${JWT_ALGO:-HS256}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - olist_network
    command: >
      sh -c "[ -f .env ] || cp env.example .env &&
             composer install --no-interaction --prefer-dist --optimize-autoloader &&
             php artisan key:generate --force || true &&
             php artisan jwt:secret --force 2>&1 || echo 'JWT_SECRET already set' &&
             php artisan config:clear &&
             php artisan migrate --force &&
             php artisan db:seed --force || true &&
             php artisan serve --host=0.0.0.0 --port=8000"

  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: olist_checkout_nextjs
    working_dir: /app
    volumes:
      - ./frontend:/app
      - nextjs_node_modules:/app/node_modules
      - /app/.next
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - WATCHPACK_POLLING=true
    depends_on:
      - laravel
    networks:
      - olist_network
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  backend_storage:
    driver: local
  backend_bootstrap_cache:
    driver: local
  nextjs_node_modules:
    driver: local
  nextjs_next:
    driver: local

networks:
  olist_network:
    driver: bridge

